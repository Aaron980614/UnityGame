<!DOCTYPE html>
<html lang="zh-TW">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網頁</title>
    <style>
        h1 {
            color: blue;
        }
        </style>
</head>
<body>
    <h1>我的網頁</h1>
    <h2 style="color: red">歡迎來到我的網頁,顏色可使用RGB值或16進位色碼!</h2>
    <p><strong>這是一個簡單的HTML範例。</strong></p>
    <p><em>這是一個簡單的HTML範例。</em></p>
    <p><a href="#">可以放網址，或其他頁面</a></p>
    <ol>
        <li>第一項</li>
        <li>第二項</li>
        <li>第三項</li>
    </ol>
    <ul>
        <li>第一項</li>
        <li>第二項</li>
        <li>第三項</li>
    </ul>
    <blockquote cite="#">"這是一個引用的段落，<br>並可放引用網址。"</blockquote>
    <img src="images/螢幕擷取畫面 2025-06-28 144639.png" alt="示例圖片">
</body>
</html>
